<title>HarteBurn Board</title>
<style>
/* Layout: the Done checklist on top (open lines first), the beats as a timebox strip, then the open
   work (left) beside what needs the owner and what changed (right); the runs folded at the foot. */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --fg:#1d1b1a; --muted:#6b6560; --line:#e4e0dc;
  --accent:#b3261e; --accent-soft:#f6e3e1;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#9a6700; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#f6e3e1;
  --idle:#5b6470; --idle-soft:#e9ecef;
  --display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1d1b1a; --fg:#ece8e4; --muted:#a29a93; --line:#33302d;
  --accent:#ef8a80; --accent-soft:#3a1d1a;
  --ok:#6fcf9b; --ok-soft:#173225; --warn:#e6b34c; --warn-soft:#352a12; --bad:#ef8a80; --bad-soft:#3a1d1a;
  --idle:#a8b0ba; --idle-soft:#262a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1d1b1a; --fg:#ece8e4; --muted:#a29a93; --line:#33302d;
  --accent:#ef8a80; --accent-soft:#3a1d1a;
  --ok:#6fcf9b; --ok-soft:#173225; --warn:#e6b34c; --warn-soft:#352a12; --bad:#ef8a80; --bad-soft:#3a1d1a;
  --idle:#a8b0ba; --idle-soft:#262a2e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.15}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.top>div{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:4px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-open{background:var(--warn-soft);color:var(--warn)} .p-done{background:var(--ok-soft);color:var(--ok)}
.p-notdone{background:var(--bad-soft);color:var(--bad)} .p-closed{background:var(--idle-soft);color:var(--idle)}
.fresh{font-size:12px} .stale{color:var(--bad);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.frame ul{margin:0;padding-left:18px;display:grid;gap:4px}
.roles{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.beats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.beat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:6px;min-width:0}
.beat.here{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.beat .name{font-family:var(--display);font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar.over>i{background:var(--warn)} .bar.over2>i{background:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.side{display:grid;gap:18px}
.group{display:grid;gap:6px}
.group h3{margin:6px 0 0;font-size:14px;font-family:var(--display)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .text{min-width:0;overflow-wrap:anywhere}
.item.dropped .text{text-decoration:line-through;color:var(--muted)}
.item .note{font-size:13px;color:var(--muted)}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;min-width:64px;text-align:center}
.s-done{background:var(--ok-soft);color:var(--ok)} .s-doing{background:var(--warn-soft);color:var(--warn)}
.s-todo{background:var(--idle-soft);color:var(--idle)} .s-dropped{background:var(--idle-soft);color:var(--muted)}
.s-blocked{background:var(--bad-soft);color:var(--bad)}
.item.doing .text{font-weight:700} .here-mark{color:var(--accent)}
.dw{border-color:var(--accent)}
details.panel>summary{cursor:pointer;list-style-position:inside}
.yours{border-color:var(--accent)}
.yours li{font-weight:700}
.yours ul,.check ul{margin:0;padding-left:18px;display:grid;gap:4px}
.scope{display:grid;gap:8px}
.chg{display:grid;gap:2px;padding-top:8px;border-top:1px solid var(--line)}
.chg:first-child{border-top:0;padding-top:0}
.chg .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.k-added{color:var(--ok)} .k-dropped{color:var(--bad)} .k-changed{color:var(--warn)}
.hist{display:grid;gap:6px}
.hist .row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.runs{border-collapse:collapse;font-size:12px;width:100%}
.runs th,.runs td{text-align:left;padding:4px 8px;border-top:1px solid var(--line);white-space:nowrap}
.runs th{color:var(--muted);font-weight:400;border-top:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:20px;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.beat.here{transition:box-shadow .3s}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">

<div class="wrap" id="app">
  <div class="empty panel" id="empty">
    <b>No objective on the board yet</b>
    HarteBurn's <span class="mono">/frame</span> starts one here: the checklist that defines Done, the beats with their timeboxes, and the open work.
  </div>
</div>

<script>
// A copy of scripts/board-schema.mjs (BEATS, STATE_WORD, the aliases, doneOrder, beatMinutes):
// a published page can't import the plugin's files. tests/board.test.mjs holds the copy equal and
// runs this page against a record.
const BEATS = [
  ["frame","Frame",10],["ready","Ready",15],["slices","Slices",5],["prd","PRD panel",null],["build","Build + prove",null],["done","Done review",10],["retro","Retro",10]
];
const STATE_WORD = {doing:"In progress",blocked:"Blocked",todo:"To do",done:"Done",dropped:"Dropped"};
const STATE_ALIASES = {open:"todo",here:"doing"};
const CHECKPOINT_ALIASES = {waits_on:"waiting",ship_now:"can_ship"};
const KIND_LEAD = {found:"Found: ",mistake:"Our mistake: "};
const STATUS = {open:["Open","p-open"],done:["Done","p-done"],"not done":["Not done","p-notdone"],closed:["Closed","p-closed"]};
const app = document.getElementById("app");
let objectives = [];

const stateOf = x => STATE_ALIASES[x?.state] || x?.state || "todo";
function doneOrder(lines){
  const rank = d => (d.kind === "gate" ? 10 : 0) + ((["doing","blocked","todo","done","dropped"].indexOf(stateOf(d)) + 6) % 6);
  return lines.map((d,n) => [d,n]).sort((a,b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(([d]) => d);
}
function beatMinutes(b, now = Date.now()){
  if (b?.started_at) return Math.round(((b.ended_at ? Date.parse(b.ended_at) : now) - Date.parse(b.started_at)) / 60000);
  return b?.used ?? 0;
}
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if (k==="class") e.className=v; else e.setAttribute(k,v); }
  for (const k of kids.flat()) if (k!=null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function ago(iso){
  if (!iso) return null;
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return isNaN(m) ? null : m;
}
function lineEl(d, prefix = ""){
  const st = stateOf(d);
  return el("div",{class:"item"+(st==="dropped"?" dropped":"")+(st==="doing"?" doing":"")},
    el("span",{class:"st s-"+st}, STATE_WORD[st]||st),
    el("div",{class:"text"}, prefix, String(d.text||"").toLowerCase().startsWith((KIND_LEAD[d.kind]||"\u0000").toLowerCase()) ? "" : KIND_LEAD[d.kind]||"", d.text, st==="doing" ? el("b",{class:"here-mark"}," ← here") : null,
      d.proven ? el("div",{class:"note"}, "Proven: " + d.proven) : null,
      (d.evidence||d.note) ? el("div",{class:"note"}, d.evidence||d.note) : null));
}
// Retro 2026-10-21 (Change 2): the numbered pieces Slices froze, as board.md shows them.
function pieceEl(p, frozen){
  const st = stateOf(p), used = beatMinutes(p);
  const over = p.timebox && used > 2 * p.timebox ? " · over 2×" : p.timebox && used > p.timebox ? " · over" : "";
  const added = typeof frozen === "number" && p.n > frozen ? ` · added after Slices: ${p.go || "no go"}` : "";
  return el("div",{class:"item"+(st==="dropped"?" dropped":"")+(st==="doing"?" doing":"")},
    el("span",{class:"st s-"+st}, STATE_WORD[st]||st),
    el("div",{class:"text"}, `${p.n}. `, p.text, st==="doing" ? el("b",{class:"here-mark"}," ← here") : null,
      el("div",{class:"note"}, `Check: ${p.check || "none"} · ${used} of ${p.timebox ?? "?"} min${over} · price ${p.price ?? "?"} min${added}${p.owner_call ? " · owner: " + p.owner_call : ""}`),
      p.note ? el("div",{class:"note"}, p.note) : null));
}
function render(){
  app.replaceChildren();
  const cur = objectives.find(o => o.status === "open") || objectives[0];
  if (!cur){
    app.append(el("div",{class:"empty panel"}, el("b",{},"No objective on the board yet"),
      "HarteBurn's ", el("span",{class:"mono"},"/frame"), " starts one here: the checklist that defines Done, the beats with their timeboxes, and the open work."));
    return;
  }
  const [word, cls] = STATUS[cur.status] || STATUS.open;
  const m = ago(cur.updated_at);
  const fresh = m == null ? "" : (m > 10 && cur.status === "open"
    ? el("span",{class:"fresh stale"}, `No update for ${m} min`)
    : el("span",{class:"fresh muted"}, m < 1 ? "Updated just now" : `Updated ${m} min ago`));
  app.append(el("div",{class:"top"},
    el("div",{}, el("div",{class:"eyebrow"}, `${cur.project || ""} · opened ${cur.opened_at ? new Date(cur.opened_at).toLocaleString() : ""}`),
      el("h1",{}, cur.title || "Objective")),
    el("div",{style:"display:grid;gap:4px;justify-items:end"}, el("span",{class:"pill "+cls}, word), fresh)));

  // The Done checklist leads (jg 2026-10-19): open lines first, gates last.
  const dw = cur.done_when || [];
  if (dw.length){
    const ordered = doneOrder(dw);
    const outcomes = ordered.filter(d => d.kind !== "gate"), gates = ordered.filter(d => d.kind === "gate");
    const finished = outcomes.filter(d => stateOf(d) === "done").length, total = outcomes.filter(d => stateOf(d) !== "dropped").length;
    app.append(el("div",{class:"panel dw"}, el("h2",{}, `Done when · ${finished} of ${total}`),
      el("div",{class:"group"}, outcomes.map(d => lineEl(d))),
      gates.length ? el("div",{class:"group"}, el("h3",{},"Gates"), gates.map(d => lineEl(d))) : null,
      cur.roles ? el("div",{class:"roles"}, [].concat(cur.roles).join(", ")) : null));
  } else if (cur.frame?.length || cur.roles){
    app.append(el("div",{class:"panel frame"}, el("h2",{},"The objective in production terms"),
      cur.frame?.length ? el("ul",{}, cur.frame.map(f => el("li",{}, f))) : null,
      cur.roles ? el("div",{class:"roles"}, [].concat(cur.roles).join(", ")) : null));
  }

  const pieces = cur.pieces || [];
  if (pieces.length){
    const now = pieces.find(p => stateOf(p) === "doing");
    const done = pieces.filter(p => stateOf(p) === "done").length, dropped = pieces.filter(p => stateOf(p) === "dropped").length;
    const counts = [`${done} done`, dropped ? `${dropped} dropped` : ""].filter(Boolean).join(", ");
    app.append(el("div",{class:"panel"}, el("h2",{}, now ? `Pieces · piece ${now.n} of ${pieces.length} (${counts})` : `Pieces · ${done} of ${pieces.length} done${dropped ? ` (${dropped} dropped)` : ""}`),
      el("div",{class:"group"}, pieces.map(p => pieceEl(p, cur.pieces_at_slices)))));
  }

  const beatData = Object.fromEntries((cur.beats||[]).map(b => [b.key, b]));
  app.append(el("div",{class:"beats"}, BEATS.filter(([key]) => key !== "prd" || beatData.prd).map(([key,label,def]) => {
    const b = beatData[key] || {};
    // A dated replan's timebox is the current one (board-schema.mjs currentTimebox).
    const box = [...(b.replans||[])].reverse().find(r => /\b\d{4}-\d{2}-\d{2}\b/.test(String(r?.at||"")) && r?.timebox > 0)?.timebox ?? b.timebox ?? def; const used = beatMinutes(b);
    const ratio = box ? used / box : 0;
    const bar = el("div",{class:"bar"+(ratio>2?" over2":ratio>1?" over":"")}, el("i",{style:`width:${Math.min(100, box ? ratio*100 : (b.state==="done"?100:0))}%`}));
    const st = b.state === "open" ? "todo" : (b.state || "todo");
    return el("div",{class:"beat"+(st==="here"?" here":"")},
      el("div",{class:"name"}, label, el("span",{class:"st s-"+(st==="here"?"doing":st)}, st==="here"?"Here":STATE_WORD[st]||st)),
      bar,
      el("div",{class:"mono muted",style:"font-size:12px"}, box ? `${used} of ${box} min` : `${used} min`));
  })));

  const label = Object.fromEntries(BEATS.map(([k,l]) => [k,l]));
  const open = (cur.items || []).filter(i => !["done","dropped"].includes(stateOf(i)));
  const rank = i => (["doing","blocked","todo"].indexOf(stateOf(i)) + 4) % 4; // an unknown state last, as in board.md
  const work = el("div",{class:"panel"}, el("h2",{},`Open work (${open.length})`));
  if (open.length) work.append(el("div",{class:"group"}, open.map((x,n) => [x,n]).sort((a,b) => rank(a[0]) - rank(b[0]) || a[1] - b[1])
    .map(([i]) => lineEl(i, i.beat ? `[${label[i.beat]||i.beat}] ` : ""))));
  else work.append(el("div",{class:"muted"},"Nothing open. Finished work is in the log."));
  if (cur.log_count != null) work.append(el("div",{class:"muted",style:"font-size:13px"}, `Log: ${cur.log_count} finished item${cur.log_count===1?"":"s"} in the repo, read by /retro.`));

  const side = el("div",{class:"side"});
  if (cur.yours?.length) side.append(el("div",{class:"panel yours"}, el("h2",{},"Yours"), el("ul",{}, cur.yours.map(y => el("li",{}, y)))));
  if (cur.checkpoint){
    const c = {...cur.checkpoint};
    for (const [old,now] of Object.entries(CHECKPOINT_ALIASES)) if (c[now] == null && c[old] != null) c[now] = c[old];
    side.append(el("div",{class:"panel check"}, el("h2",{},"Last checkpoint"), el("ul",{},
      el("li",{}, "On the objective: ", el("b",{}, c.on_objective||"—")),
      el("li",{}, "Waiting on: ", el("b",{}, c.waiting||"—")),
      el("li",{}, "Can ship now: ", el("b",{}, c.can_ship||"—")))));
  }
  const scope = cur.scope || [];
  side.append(el("div",{class:"panel"}, el("h2",{},`Scope changes (${scope.length})`),
    scope.length ? el("div",{class:"scope"}, [...scope].reverse().map(s => el("div",{class:"chg"},
      el("span",{class:"k k-"+(s.change||"changed")}, s.change||"changed"),
      el("div",{}, s.what), el("div",{class:"muted",style:"font-size:13px"}, [s.why, s.who, s.at ? new Date(s.at).toLocaleString() : null].filter(Boolean).join(" · ")),
      el("div",{class:s.price ? "muted" : "stale",style:"font-size:13px"}, s.price ? `Price: ${s.price}` : "Unpriced"))))
      : el("div",{class:"muted"},"None yet. Anything added, dropped or changed after Frame shows here, with why, who decided and its price.")));
  app.append(el("div",{class:"cols"}, work, side));

  const runs = cur.runs || [];
  if (runs.length || cur.session_model){
    const total = runs.reduce((a,r) => a + (r.tokens||0), 0);
    app.append(el("details",{class:"panel"}, el("summary",{}, el("h2",{style:"display:inline"},`Agent runs (${runs.length})${total ? " · " + Math.round(total/1000) + "k tokens" : ""}${cur.session_model ? " · Tech Lead on " + cur.session_model : ""}`)),
      runs.length ? el("div",{style:"overflow-x:auto"}, el("table",{class:"runs mono"},
        el("tr",{}, ["Role","Model","Purpose","Tokens","Min"].map(h => el("th",{}, h))),
        runs.map(r => el("tr",{}, el("td",{}, r.role), el("td",{}, r.model||"—"), el("td",{style:"font-family:var(--body)"}, r.purpose||""),
          el("td",{}, r.tokens ? Math.round(r.tokens/1000)+"k" : "—"), el("td",{}, r.minutes ?? "—"))))) : null));
  }
  const past = objectives.filter(o => o !== cur);
  if (past.length) app.append(el("div",{class:"panel"}, el("h2",{},"Earlier objectives"), el("div",{class:"hist"},
    past.map(o => { const [w,c] = STATUS[o.status]||STATUS.closed; return el("div",{class:"row"},
      el("span",{}, o.title), el("span",{}, el("span",{class:"pill "+c}, w), " ", el("span",{class:"mono muted",style:"font-size:12px"}, o.closed_at ? new Date(o.closed_at).toLocaleDateString() : ""))); }))));
}

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) return;
  db.collection("objectives").orderBy("opened_at","desc").limit(12).onSnapshot(
    snap => { objectives = snap.docs.map(d => d.data()); render(); },
    () => {});
  setInterval(render, 60000);
})();
</script>
